<title>SomnaFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap">
<style>
/* Layout: one phone-width column of soft panels, a persistent mini-player and a three-tab bar pinned to the bottom. */
/* Single dark look on purpose: a sleep app must not flash a light theme at night. */
:root {
  color-scheme: dark;
  --bg: #0B0817; --surface: #16112C; --raised: #211A40; --line: #2E2556;
  --primary: #9B82F3; --soft: #C9B8FF; --deep: #5B45B0; --ink: #160F30;
  --text: #EDE6F7; --muted: #A198BD; --warm: #E8B98A; --good: #8FD3B0; --veil: rgba(8,4,0,.45);
  --display: "Marcellus", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
#app { max-width: 560px; margin: 0 auto; padding-block: 14px 190px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
h1 { font: 400 28px/1.15 var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font: 600 17px/1.3 var(--body); margin: 12px 0 0; }
p { margin: 0; }
.sub, .note { color: var(--muted); font-size: 13px; }
.head { display: flex; gap: 12px; align-items: center; }
.back { background: none; border: 0; color: var(--soft); font: 500 12px var(--body); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.back b { font-size: 22px; line-height: 1; font-weight: 400; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel.raised { background: var(--raised); }
button { font-family: var(--body); }
.btn { width: 100%; min-height: 52px; border: 0; border-radius: 16px; background: var(--primary); color: var(--ink); font: 600 15px var(--body); padding: 12px 16px; cursor: pointer; }
.btn.sec { background: var(--raised); color: var(--soft); }
.btn:disabled { background: var(--raised); color: var(--muted); }
.btn:focus-visible, .pill:focus-visible, .tab:focus-visible, .row:focus-visible, input:focus-visible { outline: 2px solid var(--soft); outline-offset: 2px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1px solid transparent; border-radius: 999px; background: var(--raised); color: var(--muted); font: 400 13px var(--body); padding: 9px 14px; cursor: pointer; }
.pill.on { border-color: var(--primary); background: rgba(155,130,243,.28); color: var(--text); font-weight: 600; }
.scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.scroll > * { flex: none; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.stat { background: var(--raised); border-radius: 16px; padding: 12px; min-width: 0; }
.stat b { display: block; font: 600 19px var(--body); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; color: inherit; text-align: left; padding: 8px 2px; border-radius: 12px; cursor: pointer; font: inherit; }
.row > div:not(.art) { flex: 1; min-width: 0; }
.row em { font-style: normal; color: var(--soft); font-size: 13px; white-space: nowrap; }
.art { border-radius: 14px; width: 58px; height: 58px; flex: none; position: relative; overflow: hidden; }
.art::after { content: ""; position: absolute; width: 14%; aspect-ratio: 1; border-radius: 50%; background: #F1E4C8; opacity: .75; right: 22%; top: 20%; }
.art::before { content: ""; position: absolute; width: 80%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.13); left: 8%; top: -10%; }
.card { width: 150px; background: none; border: 0; color: inherit; text-align: left; padding: 0; cursor: pointer; font: inherit; }
.card .art { width: 150px; height: 104px; border-radius: 18px; margin-bottom: 6px; }
.bar { height: 10px; border-radius: 5px; background: var(--raised); position: relative; overflow: visible; flex: 1; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--primary); max-width: 100%; }
.bar u { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--warm); }
.step { display: flex; align-items: center; gap: 8px; }
.step > span:first-child { flex: 1; }
.step b { min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--raised); color: var(--soft); font-size: 22px; cursor: pointer; }
.panel.raised .round { background: var(--surface); }
.tog { display: flex; align-items: center; gap: 12px; }
.tog > div { flex: 1; }
.sw { width: 52px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--raised); position: relative; cursor: pointer; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.sw.on { background: var(--primary); } .sw.on::after { transform: translateX(22px); background: var(--text); }
input[type=range] { width: 100%; accent-color: var(--primary); height: 32px; }
textarea { width: 100%; min-height: 70px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font: 15px var(--body); }
canvas { display: block; width: 100%; }
.fader { display: grid; grid-template-columns: 62px 1fr 38px; align-items: center; gap: 8px; font-size: 13px; }
.fader span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.gauge { width: 112px; flex: none; text-align: center; position: relative; }
.gauge b { position: absolute; inset: 34px 0 auto; font: 700 30px var(--body); }
.gauge span { position: absolute; inset: 70px 0 auto; font-size: 11px; color: var(--muted); }
.caption { font: 400 19px/1.45 var(--display); color: var(--soft); text-align: center; min-height: 56px; }
.big { font: 700 44px var(--body); font-variant-numeric: tabular-nums; }
.opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid transparent; border-radius: 16px; padding: 16px; color: var(--text); font: 15px var(--body); cursor: pointer; }
.opt.on { background: rgba(155,130,243,.28); border-color: var(--primary); }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.opt.on .dot, .done .dot { border-color: var(--good); background: var(--good); }
#dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
#dock > div { max-width: 560px; margin: 0 auto; }
#mini { display: flex; align-items: center; gap: 10px; background: var(--raised); border-radius: 18px; padding: 8px; margin: 8px 2px 2px; cursor: pointer; }
#mini .art { width: 44px; height: 44px; border-radius: 12px; }
#mini > div:not(.art) { flex: 1; min-width: 0; }
#mini strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mini button { background: none; border: 0; color: var(--soft); font: 500 11px var(--body); width: 56px; cursor: pointer; }
#mini button b { display: block; font-size: 22px; line-height: 1.1; }
#tabs { display: flex; }
.tab { flex: 1; background: none; border: 0; color: var(--muted); font: 400 12px var(--body); padding: 8px 0 6px; cursor: pointer; }
.tab b { display: block; margin: 0 auto 2px; width: 60px; border-radius: 999px; font-size: 20px; line-height: 30px; font-weight: 400; }
.tab.on { color: var(--text); font-weight: 600; } .tab.on b { background: rgba(155,130,243,.25); color: var(--soft); }
#veil { position: fixed; inset: 0; background: var(--veil); pointer-events: none; z-index: 8; }
#night { position: fixed; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #3a3350; text-align: center; padding: 30px; }
#night.alarm { background: var(--bg); color: var(--text); }
#night .big { color: inherit; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>
<div id="veil" hidden></div>
<div id="dock"><div>
  <div id="mini" hidden data-a="go:player"><div class="art" id="miniArt"></div><div><strong id="miniTitle"></strong><canvas id="miniWave" height="16"></canvas></div><button data-a="toggle" id="miniBtn"></button></div>
  <nav id="tabs">
    <button class="tab" data-a="tab:home"><b>☾</b>Home</button>
    <button class="tab" data-a="tab:library"><b>♫</b>Library</button>
    <button class="tab" data-a="tab:profile"><b>◉</b>Profile</button>
  </nav>
</div></div>
<div id="night" hidden></div>

<script>
"use strict";
const D = /*CONTENT*/;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- Store: everything stays in this browser ---------------- */
const DEF = { set: { bed: 1350, wake: 390, need: 8, lead: 45, alarm: true, win: 30, timer: 45, snore: "buzz", loop: true, dim: true },
  moods: [], assess: [], nights: [], sessions: [], day: {}, tasks: {}, sleep: {}, mix: null, wdUntil: 0 };
let S = JSON.parse(JSON.stringify(DEF));
try { const raw = JSON.parse(localStorage.getItem("somnaflow") || "null"); if (raw) S = Object.assign(S, raw, { set: Object.assign(S.set, raw.set || {}) }); } catch (e) {}
const save = () => { try { localStorage.setItem("somnaflow", JSON.stringify(S)); } catch (e) {} };
const dstr = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => dstr(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const fmtClock = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60); return (h % 12 || 12) + ":" + String(m % 60).padStart(2, "0") + (h < 12 ? " AM" : " PM"); };
const fmtDur = m => m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + "m";

/* ---------------- Sleep maths (same formulas as the Android app) ---------------- */
const asleepMin = n => [...n.epochs].filter(c => c !== "W").length;
function sleepHours(date) { const t = S.nights.filter(n => dstr(new Date(n.end)) === date).reduce((a, n) => a + asleepMin(n), 0) / 60; return t > 0.5 ? t : (S.sleep[date] ?? null); }
const last14 = () => Array.from({ length: 14 }, (_, i) => sleepHours(dstr(daysAgo(13 - i))));
const debt = () => last14().reduce((d, h) => h == null ? d : Math.max(0, d + S.set.need - h), 0);
function energyCurve(lastSleep, dbt) {
  const { wake, bed, need } = S.set, s0 = clamp(0.12 + 0.5 * clamp((need - lastSleep) / need, 0, 1) + Math.min(0.25, dbt / 40), 0.05, 0.9);
  const awake = ((bed - wake + 1440) % 1440) || 1440;
  return Array.from({ length: 96 }, (_, i) => { const m = i * 15, since = (m - wake + 1440) % 1440, h = m / 60;
    const c = 0.5 + 0.5 * (0.55 * Math.cos(2 * Math.PI * (h - 18) / 24) + 0.45 * Math.cos(4 * Math.PI * (h - 9.5) / 24));

}
function stage(act) { let out = "", still = 0; const n = act.length;
  for (let i = 0; i < n; i++) { let w = 0; for (let k = -4; k <= 2; k++) { const j = i + k; if (j >= 0 && j < n) w += act[j] * (k === 0 ? 2 : 1 / (1 + Math.abs(k))); }
    const aw = w > 9; still = (act[i] === 0 && !aw) ? still + 1 : 0; out += aw ? "W" : still >= 12 ? "D" : "L"; } return out; }
function sleepOnset(e) { let run = 0; for (let i = 0; i < e.length; i++) { run = e[i] !== "W" ? run + 1 : 0; if (run >= 10) return i - 9; } return e.length; }
const checkedIn = () => S.moods.length && dstr(new Date(S.moods[S.moods.length - 1].t)) === today();
function tasksDone() { const s = new Set(S.tasks[today()] || []); if ((S.day[today()] || 0) >= 80) s.add("daylight"); if (checkedIn()) s.add("checkin"); return s; }
const readiness = () => Math.round(clamp(100 * (0.55 * tasksDone().size / D.tasks.length + 0.18 * Math.min(1, (S.day[today()] || 0) / 80) + 0.10 * (checkedIn() ? 1 : 0) + 0.17 * clamp(1 - debt() / 10, 0, 1)), 0, 100));
function severity() { const a = S.assess.filter(x => x.type === "psqi").pop(); return !a ? 0 : a.score <= 5 ? 1 : a.score <= 10 ? 2 : 3; }
function streak() { const days = new Set(); S.moods.forEach(m => days.add(dstr(new Date(m.t)))); S.nights.forEach(n => days.add(dstr(new Date(n.end)))); S.sessions.forEach(t => days.add(dstr(new Date(t))));
  Object.keys(S.tasks).forEach(k => S.tasks[k].length && days.add(k)); let i = days.has(today()) ? 0 : 1, n = 0; while (days.has(dstr(daysAgo(i)))) { n++; i++; } return n; }
const dayOk = () => ((nowMin() - S.set.wake + 1440) % 1440) <= ((S.set.bed - 180 - S.set.wake + 2880) % 1440);

/* ---------------- Questionnaire scoring ---------------- */
const bucket = (v, lim) => { for (let i = 0; i < lim.length; i++) if (v <= lim[i]) return i; return lim.length; };
function psqiParts(a) { const hours = a[3] / 10, inBed = ((a[2] - a[0] + 1440) % 1440) / 60, eff = inBed <= 0 ? 100 : hours / inBed * 100;
  return [a[14], bucket(bucket(a[1], [15, 30, 60]) + a[4], [0, 2, 4]), hours > 7 ? 0 : hours >= 6 ? 1 : hours >= 5 ? 2 : 3, eff >= 85 ? 0 : eff >= 75 ? 1 : eff >= 65 ? 2 : 3,
    bucket(a.slice(5, 14).reduce((x, y) => x + y, 0), [0, 9, 18]), a[15], bucket(a[16] + a[17], [0, 2, 4])]; }
const PSQI_PARTS = ["Subjective quality", "Sleep latency", "Sleep duration", "Sleep efficiency", "Disturbances", "Sleep medication", "Daytime dysfunction"];
const score = (id, a) => id === "psqi" ? psqiParts(a).reduce((x, y) => x + y, 0) : a.reduce((x, y) => x + y, 0);
const band = (id, s) => id === "psqi" ? (s <= 5 ? "Good sleep quality" : s <= 10 ? "Moderate sleep disturbance" : "Severe sleep disturbance")
  : id === "phq9" ? (s <= 4 ? "Minimal symptoms" : s <= 9 ? "Mild symptoms" : s <= 14 ? "Moderate symptoms" : s <= 19 ? "Moderately severe symptoms" : "Severe symptoms")
  : (s <= 4 ? "Minimal anxiety" : s <= 9 ? "Mild anxiety" : s <= 14 ? "Moderate anxiety" : "Severe anxiety");

/* ---------------- Sound synthesis: every layer is generated here, nothing is downloaded ---------------- */
const rnd = (a, b) => a + (b - a) * Math.random(), bi = () => Math.random() * 2 - 1;
function pinkGen() { let b0 = 0, b1 = 0, b2 = 0; return () => { const w = bi(); b0 = 0.99765 * b0 + w * 0.099046; b1 = 0.963 * b1 + w * 0.2965164; b2 = 0.57 * b2 + w * 1.0526913; return (b0 + b1 + b2 + w * 0.1848) * 0.22; }; }
function brownGen() { let b = 0; return () => { b = (b + 0.02 * bi()) / 1.02; return b * 3.5; }; }
function biquad(type, f, q, sr) { let b0, b1, b2, a1, a2, z1 = 0, z2 = 0;
  const set = (f, q) => { const w = 2 * Math.PI * f / sr, c = Math.cos(w), al = Math.sin(w) / (2 * q), a0 = 1 + al;
    if (type === "lp") { b0 = (1 - c) / 2 / a0; b1 = (1 - c) / a0; b2 = b0; } else if (type === "hp") { b0 = (1 + c) / 2 / a0; b1 = -(1 + c) / a0; b2 = b0; } else { b0 = al / a0; b1 = 0; b2 = -al / a0; }
    a1 = -2 * c / a0; a2 = (1 - al) / a0; };
  set(f, q); const fn = x => { const y = b0 * x + z1; z1 = b1 * x - a1 * y + z2; z2 = b2 * x - a2 * y; return y; }; fn.set = set; return fn; }
function wander(lo, hi, minS, maxS, sr) { let v = rnd(lo, hi), step = 0, left = 0; return () => { if (left <= 0) { left = Math.floor(rnd(minS, maxS) * sr); step = (rnd(lo, hi) - v) / left; } left--; v += step; return v; }; }
const midi = m => 440 * Math.pow(2, (m - 69) / 12), TAU = Math.PI * 2;

const GEN = {
  white: (L, R) => { for (let i = 0; i < L.length; i++) { L[i] = bi() * 0.16; R[i] = bi() * 0.16; } },
  pink: (L, R) => { const a = pinkGen(), b = pinkGen(); for (let i = 0; i < L.length; i++) { L[i] = a() * 0.28; R[i] = b() * 0.28; } },
  brown: (L, R) => { const a = brownGen(), b = brownGen(); for (let i = 0; i < L.length; i++) { L[i] = a() * 0.42; R[i] = b() * 0.42; } },
  rain(L, R, sr) { const hl = biquad("hp", 450, .7, sr), hr = biquad("hp", 450, .7, sr), ll = biquad("lp", 7500, .7, sr), lr = biquad("lp", 7500, .7, sr), inten = wander(.7, 1, 4, 10, sr);
    const V = 10, ph = new Float32Array(V), inc = new Float32Array(V), amp = new Float32Array(V), dec = new Float32Array(V), pan = new Float32Array(V); let nx = 0;
    for (let i = 0; i < L.length; i++) { if (Math.random() < 26 / sr) { const k = nx; nx = (nx + 1) % V; ph[k] = 0; inc[k] = TAU * rnd(1800, 6500) / sr; amp[k] = rnd(.03, .22); dec[k] = Math.exp(-1 / (sr * rnd(.004, .02))); pan[k] = Math.random(); }
      let dl = 0, dr = 0; for (let k = 0; k < V; k++) if (amp[k] > 1e-4) { const s = Math.sin(ph[k]) * amp[k]; ph[k] += inc[k]; amp[k] *= dec[k]; dl += s * (1 - pan[k]); dr += s * pan[k]; }
      const g = inten() * .34; L[i] = ll(hl(bi())) * g + dl; R[i] = lr(hr(bi())) * g + dr; } },
  ocean(L, R, sr) { const bl = brownGen(), br = brownGen(), pl = pinkGen(), pr = pinkGen(), fl = biquad("hp", 2500, .7, sr), fr = biquad("hp", 2500, .7, sr);
    let p = 0, period = 9, peak = .9, yl = 0, yr = 0; const sh = x => x < .38 ? (x / .38) ** 2 : Math.exp(-(x - .38) * 5.2);
    for (let i = 0; i < L.length; i++) { p += 1 / (period * sr); if (p >= 1) { p -= 1; period = rnd(7, 13); peak = rnd(.55, 1); }
      const eL = sh(p) * peak, eR = sh((p + .04) % 1) * peak; yl += (.015 + .3 * eL) * ((bl() + pl() * 1.6) - yl); yr += (.015 + .3 * eR) * ((br() + pr() * 1.6) - yr);
      L[i] = yl * (.22 + eL) * .36 + fl(bi()) * eL * eL * .1; R[i] = yr * (.22 + eR) * .36 + fr(bi()) * eR * eR * .1; } },
  waterfall(L, R, sr) { const pl = pinkGen(), pr = pinkGen(), bl = brownGen(), br = brownGen(), hl = biquad("hp", 1500, .7, sr), hr = biquad("hp", 1500, .7, sr), mod = wander(.85, 1, 1.5, 4, sr);
    for (let i = 0; i < L.length; i++) { const m = mod() * .65; L[i] = (pl() * .42 + bl() * .3 + hl(bi()) * .085) * m; R[i] = (pr() * .42 + br() * .3 + hr(bi()) * .085) * m; } },
  wind(L, R, sr, level = 1) { const pl = pinkGen(), pr = pinkGen(), fl = biquad("bp", 500, 1.1, sr), fr = biquad("bp", 500, 1.1, sr), cen = wander(220, 900, 2.5, 7, sr), gust = wander(.25, 1, 2, 6, sr);
    for (let i = 0; i < L.length; i++) { const f = cen(), g = gust(); if (i % 64 === 0) { fl.set(f, 1.1); fr.set(f * 1.07, 1.1); } L[i] += fl(pl()) * g * 1.3 * level; R[i] += fr(pr()) * g * 1.3 * level; } },
  forest(L, R, sr) { GEN.wind(L, R, sr, .9); const ll = biquad("hp", 4000, .7, sr), lr = biquad("hp", 4000, .7, sr), rus = wander(0, 1, 1.5, 5, sr);
    const B = [0, 1, 2].map(() => ({ wait: Math.floor(rnd(.5, 5) * sr), left: 0, t: 0, dur: 1, gap: 1, f0: 3000, sw: 1, amp: .05, pan: .5, ph: 0 }));
    for (let i = 0; i < L.length; i++) { const ru = rus(), lg = ru * ru * .035; let sl = ll(bi()) * lg, s2 = lr(bi()) * lg;
      for (const b of B) { if (b.wait > 0) { if (--b.wait === 0) { if (b.left === 0) { b.left = 2 + Math.floor(Math.random() * 5); b.f0 = rnd(2200, 5200); b.sw = rnd(.7, 1.4); b.amp = rnd(.03, .11); b.pan = Math.random(); b.dur = Math.floor(rnd(.05, .17) * sr); b.gap = Math.floor(rnd(.04, .14) * sr); } b.t = 0; } continue; }
        const x = b.t / b.dur, e = Math.sin(Math.PI * x); b.ph += TAU * b.f0 * (1 + (b.sw - 1) * x) / sr; const s = Math.sin(b.ph) * e * e * b.amp; sl += s * (1 - b.pan); s2 += s * b.pan;
        if (++b.t >= b.dur) { b.left--; b.wait = b.left > 0 ? b.gap : Math.floor(rnd(2, 9) * sr); } }

  if (now >= at) return ring("alarm"); if (now < at - S.set.win * 60000 || T.act.length < 30) return; const r = T.act.slice(-3); if (r[2] >= 2 || r[0] + r[1] + r[2] >= 4) ring("smart"); }

  try { T.stream && T.stream.getTracks().forEach(t => t.stop()); } catch (e) {} T.act.push(T.moves);
  if (Date.now() - T.start >= 120000) { const epochs = stage(T.act); S.nights.push({ start: T.start, end: Date.now(), epochs, sol: sleepOnset(epochs), snoreMin: Math.floor(T.snoreSec / 60), pauses: T.pauses, nudges: T.nudges, br: T.breaths, wokeBy: T.wokeBy, motion: !!T.motion }); save(); go("night:" + (S.nights.length - 1)); }
  else render(); $("#night").hidden = true; if (!A.playing) wakeLock(false); }

function eegTick() { if (!E.on) return; const calming = A.playing && A.mix.b; E.arousal += ((calming ? .05 : .92) - E.arousal) / (calming ? 44 : 90); const a = E.arousal, n = () => 1 + (Math.random() - .5) * .25;
  const raw = [.08 * n() + .3 * Math.max(0, .15 - a), (1 - a) ** 2 * n(), Math.max(0, 1 - Math.abs(a - .45) * 2) * .8 * n(), a * n(), a * .25 * n()], sum = raw.reduce((x, y) => x + y); E.bands = raw.map(v => v / sum);

    else if (E.active && E.calm >= 45) { E.active = false; E.hot = 0; if (A.byLoop) stop(8); } }
  if (route === "bio") render(); }

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue("--" + v).trim(); }
function fit(c) { const r = devicePixelRatio || 1, w = c.clientWidth, h = +c.getAttribute("height"); c.width = w * r; c.height = h * r; c.style.height = h + "px"; const x = c.getContext("2d"); x.setTransform(r, 0, 0, r, 0, 0); return [x, w, h]; }

    x.beginPath(); x.moveTo(0, h); v.forEach((y, i) => x.lineTo(px(i), py(y))); x.lineTo(w, h); const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "rgba(155,130,243,.35)"); g.addColorStop(1, "rgba(155,130,243,0)"); x.fillStyle = g; x.fill();
    x.beginPath(); v.forEach((y, i) => i ? x.lineTo(px(i), py(y)) : x.moveTo(0, py(y))); x.strokeStyle = css("soft"); x.lineWidth = 2; x.stroke();
    const n = +e.dataset.n, nx = w * n / 1440; x.strokeStyle = css("warm"); x.globalAlpha = .5; x.beginPath(); x.moveTo(nx, 0); x.lineTo(nx, h); x.stroke(); x.globalAlpha = 1; x.fillStyle = css("warm"); x.beginPath(); x.arc(nx, py(v[clamp(Math.floor(n / 15), 0, 95)]), 4, 0, 7); x.fill(); }

  const tr = $("#trend"); if (tr && E.trend.length > 1) { const [x, w, h] = fit(tr); x.strokeStyle = css("warm"); x.lineWidth = 2; x.beginPath(); E.trend.forEach((v, i) => { const X = w * i / (E.trend.length - 1), Y = h * (1 - v); i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.stroke(); }
}

function paintMini() { const show = (A.playing || A.track || A.ctx) && route !== "player"; $("#mini").hidden = !show; const t = A.track, hue = t ? t.hue : 270;

const setKeys = { cs: () => setMix({ ...A.mix, cs: !A.mix.cs }), rand: () => { A.rotation = []; setMix({ ...A.mix, r: !A.mix.r }); }, loop: () => S.set.loop = !S.set.loop, dim: () => S.set.dim = !S.set.dim, alarm: () => S.set.alarm = !S.set.alarm };

  else if (key === "day") S.day[today()] = clamp((S.day[today()] || 0) + step, 0, 600); else if (key === "slept") S.sleep[today()] = clamp((S.sleep[today()] ?? 7.5) + step, 0, 14); }
const toggleIn = (arr, x) => arr.includes(x) ? arr.filter(y => y !== x) : [...arr, x];
const ACT = {
  tab: t => { stack = []; tab = route = t; render(); scrollTo(0, 0); }, go: (...p) => go(p.join(":")), back, noop() {},
  play: id => { play(byId(id)); if (route !== "player") go("player"); else render(); }, toggle: () => { toggle(); render(); },
  filter: k => { ui.filter = k; render(); }, timer: m => { S.set.timer = +m; save(); setTimer(+m); render(); }, deftimer: m => { S.set.timer = +m; save(); render(); },
  beat: b => { setMix({ ...A.mix, b: +b }); render(); }, nat: n => { setMix({ ...A.mix, n: toggleIn(A.mix.n, n) }); render(); }, mel: m => { setMix({ ...A.mix, m: m === "none" ? "" : m }); render(); },
  resetmix: () => { setMix({ f: [.8, .5, .75, .6, 0, 0, 0, .5, .5, .5], n: ["rain"], m: "", b: 0, cs: true, r: false }); render(); },
  set: k => { setKeys[k](); save(); render(); }, inc: (k, s) => { bump(k, 1, s); save(); render(); }, dec: (k, s) => { bump(k, -1, s); save(); render(); }, snore: x => { S.set.snore = x; save(); render(); },
  task: id => { if (id === "daylight" || id === "checkin") return go(id); const d = today(), cur = S.tasks[d] || []; if (id === "stretch" && !cur.includes(id)) return go("stretch"); S.tasks[d] = toggleIn(cur, id); save(); render(); },
  emo: x => { ui.ci.e = toggleIn(ui.ci.e, x); render(); }, imp: x => { ui.ci.i = toggleIn(ui.ci.i, x); render(); },
  savemood: () => { const c = ui.ci; S.moods.push({ t: Date.now(), v: c.v, e: c.e, i: c.i, note: c.note }); save(); c.saved = true; render(); },
  ans: k => { ui.as.ans[ui.as.i] = +k; render(); }, ansd: d => { const a = ui.as, q = D.q.find(x => x.id === a.id).qs[a.i]; a.ans[a.i] = q.k === 1 ? (a.ans[a.i] + d * 15 + 1440) % 1440 : clamp(a.ans[a.i] + d * 5, 0, q.k === 2 ? 240 : 140); render(); },
  ansprev: () => { ui.as.i--; render(); }, ansnext: () => { const a = ui.as, q = D.q.find(x => x.id === a.id); if (a.i < q.qs.length - 1) a.i++; else { a.score = score(a.id, a.ans); S.assess.push({ t: Date.now(), type: a.id, score: a.score }); save(); } render(); scrollTo(0, 0); },
