name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (audio, biosignals, sleep maths, every screen)
        run: ./gradlew testDebugUnitTest
      - name: Build signed APK
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SomnaFlow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SomnaFlow-apk
          path: SomnaFlow.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SomnaFlow 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: SomnaFlow.apk
          make_latest: true
          body: |
            Download **SomnaFlow.apk** below on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when asked). Requires Android 8.0 or newer.
